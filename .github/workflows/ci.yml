name: regression-ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  own-source-and-synthetic:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install pinned tools
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { throw 'Dependencies failed' }
          python -m pip install --target .local/tools ziglang==0.15.2
          if ($LASTEXITCODE) { throw 'Compiler failed' }
          python -c "import json; from pathlib import Path; Path('.local/ci.json').write_text(json.dumps({'zig':str(Path('.local/tools/ziglang/zig.exe').resolve())}),encoding='utf-8')"
      - name: Source and synthetic regressions
        shell: pwsh
        run: ./RunTests.ps1 -Suite ci -Config .local/ci.json -Output .local/results/ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-regression-report
          path: .local/results/
