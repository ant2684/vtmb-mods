; Protean & Frenzy Improved
; 1 = enabled, 0 = disabled. All options default to enabled. Restart after editing.

[Fixes]

; Allows Frenzy to trigger while Protean 5 is active.
; Either effect can end while the other stays active.
WarformFrenzy=1

; Restores the Protean screen effect when loading a save with Protean active.
FilterLoadFix=1

; Prevents duplicate Fists and Claws and restores the correct weapon selection.
InventoryFixes=1

; Fixes transformation timing, interruptions, recovery and camera. Requires InventoryFixes.
ProteanTransformFixes=1

; Accepts a fresh attack click up to 150 ms before the next Claws combo hit.
ClawsComboBuffer=1

; Corrects positioning during and after Claws and Tiger's Claws sneak attacks.
ClawsStealthPosition=1

; Uses your selected supported melee weapon during Frenzy. Requires InventoryFixes.
MeleeFrenzy=1

; Fixes movement and collision during Frenzy in the Griffith Werewolf fight.
GriffithFrenzyCollision=1
