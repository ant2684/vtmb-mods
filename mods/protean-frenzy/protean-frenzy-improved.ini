; Protean & Frenzy Improved
; Combines Protean lifecycle, Claws and Frenzy corrections in one native plugin.
; Requires 32-bit Bloodlines, Game Mod Loader and the supported UP 12.0 modules.
; Settings are read once at startup. Restart the game after editing this file.
; Values: 0 = disabled, 1 = enabled. Every option defaults to 1 if absent.
; Invalid explicit values disable that option. Historical Core keys are ignored.
; Remove the six replaced native modules from the active loader before use.
; Models, stealth sound/blood and map permissions are separate manual components:
; their installed resource changes are not toggled by the native settings below.
; Matching Claws models keep separate ordinary/Frenzy attack pools independently
; of every option, including InventoryFixes=0 or unavailable inventory hooks.

[Fixes]

; Keeps Protean 5 and Frenzy on one owned Shadow without repeated feat growth.
; Preserves correct restoration whichever state ends first.
; Requirements: supported vampire.dll. Default: 1.
; Disabled: restores the original Protean/Frenzy interaction.
WarformFrenzy=1

; Restores saved-active Protean filter brightness independently of RedVision.
; Requirements: supported client.dll. Default: 1.
; Disabled: keeps the original filter loading behavior.
FilterLoadFix=1

; Prevents duplicate inventory registration and nested fists/Claws grants.
; Restores fists to melee slot 0 and retains Claws while Protean remains active.
; Initializes owned FrenzyShadow claws/effects even when map Outputs are disabled.
; Covers the player and owned FrenzyShadow; other NPC inventory stays native.
; Requirements: supported vampire.dll. Default: 1.
; Disabled: also prevents ProteanTransformFixes and MeleeFrenzy from activating.
InventoryFixes=1

; Preserves the original overlapping human/Warform scene, fade and duration.
; Actions interrupt the scene before that same input is processed. Feeding keeps
; its partner, bite events, blood transfer and native discipline timer extension.
; Includes return FX, saved own-scene recovery and native delayed-idle ownership.
; Requirements: InventoryFixes=1 and successfully installed native lifecycle hooks.
; Uses stock game scripts; no modified Python support file or interpreter calls.
; Default: 1. Disabled: uses original transformation and Python callback behavior.
ProteanTransformFixes=1

; Buffers a fresh attack click up to 150 ms before an authored continuation window.
; Covers the 14 existing Claws continuations; holding attack never auto-combos.
; Requirements: matching current Claws models/sequence windows. Default: 1.
; Disabled: only native continuation input windows are used; models stay installed.
ClawsComboBuffer=1

; Corrects the common XY anchor and native root-based exit of successful paired
; sneak attacks with Protean Claws and Tiger's Claws. Keeps native swept collision.
; Requirements: supported native scene helpers. Default: 1.
; Disabled: restores original scene positioning; animation resources stay installed.
ClawsStealthPosition=1

; Uses the selected supported melee weapon for Frenzy attacks and cleanup.
; Retains current positive-weight native attacks, excluding jumps, strong-push
; finishers and the farthest sword motions. Damage, speed and geometry stay native.
; Requirements: InventoryFixes=1 and successfully installed inventory protection.
; Default: 1. Missing requirements prevent custom melee binding.
; Disabled: uses the original Frenzy weapon/attack path.
MeleeFrenzy=1

; Corrects the named Griffith Werewolf's movement collision with an owned active
; FrenzyShadow and excludes the hidden original player body as ground support.
; Requirements: supported vampire.dll/engine.dll and sp_observatory_2. Frenzy
; permission on that map is a separate resource component, not granted here.
; Default: 1. Disabled: keeps the original collision and ground-support path.
GriffithFrenzyCollision=1
