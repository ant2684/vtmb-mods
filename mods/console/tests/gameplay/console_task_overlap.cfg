// Task-only native scripted pause while the console is visible.
alias ci_w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias ci_w100 "ci_w10;ci_w10;ci_w10;ci_w10;ci_w10;ci_w10;ci_w10;ci_w10;ci_w10;ci_w10"
alias ci_w1000 "ci_w100;ci_w100;ci_w100;ci_w100;ci_w100;ci_w100;ci_w100;ci_w100;ci_w100;ci_w100"
v_setpause
ci_w1000
ci_w1000
v_unpause
